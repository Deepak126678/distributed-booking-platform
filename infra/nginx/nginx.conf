
events {
    worker_connections 1024;
}

http {

    # Backend application upstream
    upstream booking_api {
        server app:8000;

        # Cache up to 32 idle upstream connections
        # per Nginx worker process.
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name booking.test localhost 127.0.0.1;

        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;

        server_name booking.test localhost 127.0.0.1;

        # TLS certificates
        ssl_certificate /etc/nginx/certs/booking.crt;
        ssl_certificate_key /etc/nginx/certs/booking.key;

        # TLS 1.2 and 1.3
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {

            proxy_pass http://booking_api;

            # Enable upstream HTTP/1.1
            proxy_http_version 1.1;

            # Allow upstream keepalive connection reuse
            proxy_set_header Connection "";

            # Forward original request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
