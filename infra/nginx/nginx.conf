
events {
    worker_connections 1024;
}

http {

    # Rate limiting zone: 10 requests per second per client IP.
    # Shared memory zone: 10 MB.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Backend application upstream
    upstream booking_api {
        server app:8000;

        # Cache up to 32 idle upstream connections
        # per Nginx worker process.
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name booking.test;

        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;

        server_name booking.test;

        # TLS certificates
        ssl_certificate /etc/nginx/certs/booking.crt;
        ssl_certificate_key /etc/nginx/certs/booking.key;

        # TLS 1.3 only for this development exercise
        ssl_protocols TLSv1.3;

        location / {

            # Apply rate limiting.
            # Limit: 10 requests/second per client IP.
            limit_req zone=api_limit;
            
            # Return HTTP 429 when the limit is exceeded.
            limit_req_status 429;

            proxy_pass http://booking_api;

            # Enable upstream HTTP/1.1
            proxy_http_version 1.1;

            # Allow upstream keepalive connection reuse
            proxy_set_header Connection "";

            # Forward original request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
